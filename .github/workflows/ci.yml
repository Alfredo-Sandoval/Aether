name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # high+ only: a low-severity advisory published against pinned dev tooling
      # should not start failing unrelated PRs overnight.
      - run: npm audit --audit-level=high
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension-package
          path: Aether-v*.zip
          if-no-files-found: error
