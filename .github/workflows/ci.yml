name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Build package
        run: npm run package

      - name: Validate packaged output
        run: |
          ZIP_NAME="Aether-v$(node -p 'require("./manifest.json").version').zip"
          node scripts/validate-package.js --zip "$ZIP_NAME" --root .

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Clear previous UI audit artifacts
        run: rm -rf .tmp/ui-audit

      - name: Run popup UI audit
        run: xvfb-run -a npm run ui:audit:popup:ci

      - name: Verify UI audit artifacts use repo-relative paths
        run: npm run ui:audit:artifacts

      - name: Upload UI audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: .tmp/ui-audit
          if-no-files-found: ignore
